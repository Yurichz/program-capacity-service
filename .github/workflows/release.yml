name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  revision:
    name: Validate release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || { echo 'Release commit must belong to main'; exit 1; }
          version=$(git show "$sha:package.json" | jq -r .version)
          [[ "v$version" == "$RELEASE_TAG" ]] || { echo 'Tag must match package.json version'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify exact release commit
    needs: revision
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.revision.outputs.sha }}
      export_image: true

  publish:
    name: Publish verified API image
    needs: [revision, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.image_artifact }}
          path: verified
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate artifact identity and publish without rebuilding
        env:
          RELEASE_SHA: ${{ needs.revision.outputs.sha }}
          RELEASE_VERSION: ${{ needs.revision.outputs.version }}
        run: |
          cd verified
          sha256sum --check api.tar.sha256
          [[ "$(jq -r '.Config.Labels["org.opencontainers.image.revision"]' image.json)" == "$RELEASE_SHA" ]]
          docker load --input api.tar
          image_id=$(docker image inspect program-capacity-service:verify --format '{{.Id}}')
          [[ "$image_id" == "$(jq -r .Id image.json)" ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "$RELEASE_VERSION" "sha-$RELEASE_SHA"; do
            if docker manifest inspect "$image:$tag" > manifest.json 2> manifest-error.txt; then
              echo "Refusing to overwrite existing image tag: $tag"
              exit 1
            elif ! grep -Eqi 'manifest unknown|manifest_unknown|no such manifest|name unknown' manifest-error.txt; then
              cat manifest-error.txt
              exit 1
            fi
          done
          docker tag "$image_id" "$image:$RELEASE_VERSION"
          docker tag "$image_id" "$image:sha-$RELEASE_SHA"
          docker push "$image:$RELEASE_VERSION"
          docker push "$image:sha-$RELEASE_SHA"
          digest=$(docker image inspect "$image:$RELEASE_VERSION" --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          printf 'Verified API image: %s\n\nCommit: %s\n\nSBOM and scan reports are attached to this run.\n' "$digest" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$digest" > image-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            verified/image-digest.txt
            verified/image.json
            verified/api-sbom.cdx.json
            verified/*-vulnerabilities.json
          if-no-files-found: error
          retention-days: 90
