version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      runtime: { dependency-type: production, update-types: [minor, patch] }
      tooling: { dependency-type: development, update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      web: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: docker
    directories: [/, /web]
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      images: { patterns: ['*'] }
