name: program-capacity
x-app: &app
  image: program-capacity-service:local
  build: .
  environment: &environment
    DATABASE_URL: postgresql://capacity:capacity@postgres:5432/capacity
    KAFKA_BROKERS: kafka:9092
    KAFKA_TOPIC: treasury.capacity.v1
    API_URL: http://app:3000
  volumes:
    - ./.dev/runtime.env:/app/.dev/runtime.env:ro
services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    ports: ['127.0.0.1:15432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capacity -d capacity']
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    ports: ['127.0.0.1:19092:19092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 3145728
      KAFKA_REPLICA_FETCH_MAX_BYTES: 4194304
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ['kafka-data:/var/lib/kafka/data']
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
  kafka-init:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: /opt/kafka/bin/kafka-topics.sh
    command: ['--bootstrap-server', 'kafka:9092', '--create', '--if-not-exists', '--topic', 'treasury.capacity.v1', '--partitions', '3', '--replication-factor', '1', '--config', 'max.message.bytes=3145728']
  migrate:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
    command: ['sh', '-ec', 'npm run db:migrate && npm run db:seed']
  app:
    <<: *app
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    init: true
    stop_grace_period: 40s
    healthcheck:
      test: ['CMD', 'node', '-e', "const s=require('net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  tools:
    <<: *app
    profiles: ['tools']
    volumes: ['./.dev:/app/.dev']
    command: ['npm', 'run', 'dev:prepare']

volumes:
  postgres-data:
  kafka-data:
